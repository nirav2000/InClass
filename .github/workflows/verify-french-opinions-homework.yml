name: Verify latest French opinions homework

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-french-opinions-homework.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install chromium
      - name: Exercise deployed homework flow
        run: |
          timeout 90s node <<'NODE'
          const { chromium } = require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let browser=null;
            for(let attempt=1;attempt<=8;attempt++){
              browser=await chromium.launch({headless:true});
              const page=await browser.newPage({serviceWorkers:'block'});
              page.setDefaultTimeout(12000);
              await page.addInitScript(()=>{window.__spoken=[];});
              await page.goto('https://nirav2000.github.io/InClass/?opinions_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:25000});
              const hasPack=await page.evaluate(()=>Array.from(document.scripts).some(s=>String(s.src).includes('2026-10-05-french-opinions.js')));
              if(!hasPack){await browser.close();browser=null;await sleep(5000);continue;}

              await page.waitForSelector('#subjectSelect',{state:'attached'});
              await page.evaluate(()=>{
                const s=document.querySelector('#subjectSelect');
                s.value='French';s.dispatchEvent(new Event('change',{bubbles:true}));
              });
              await page.waitForSelector('#weekSelect',{state:'attached'});
              const hasWeek=await page.evaluate(()=>Array.from(document.querySelector('#weekSelect').options).some(o=>o.value==='2026-10-05-french-opinions'));
              if(!hasWeek){await browser.close();browser=null;await sleep(5000);continue;}
              await page.evaluate(()=>{
                const s=document.querySelector('#weekSelect');
                s.value='2026-10-05-french-opinions';s.dispatchEvent(new Event('change',{bubbles:true}));
              });

              await page.waitForSelector('#frDecode',{state:'attached'});
              const title=await page.locator('#heroTitle').textContent();
              if(!/Opinions about animals/.test(title))throw new Error('Wrong homework title: '+title);

              const people=await page.locator('#opinionPerson option').allTextContents();
              if(people.join('|')!=='Chantal|Ahmed|Ethan|Sophie')throw new Error('Unexpected people: '+people.join('|'));

              await page.evaluate(()=>{
                window.speak=(text,lang)=>window.__spoken.push({text,lang});
                const button=Array.from(document.querySelectorAll('.wordButton')).find(b=>decodeURIComponent(b.dataset.audio||'')==='Je m’appelle');
                if(!button)throw new Error('Je m’appelle school-word button missing');
                button.click();
              });
              const spoken=await page.evaluate(()=>window.__spoken.at(-1));
              if(!spoken||spoken.text!=='Je m’appelle'||spoken.lang!=='fr-FR')throw new Error('School-word audio wiring failed: '+JSON.stringify(spoken));

              await page.evaluate(()=>{
                const s=document.querySelector('#opinionPerson');s.value='sophie';s.dispatchEvent(new Event('change',{bubbles:true}));
              });
              const built=await page.locator('#builtFrench').textContent();
              if(!built.includes('Je m’appelle Sophie')||!built.includes('J’adore les chats')||!built.includes('Je n’aime pas les chevaux'))throw new Error('Sophie model sentence incorrect: '+built);

              await page.evaluate(()=>{
                const s=document.querySelector('#writePerson');s.value='ahmed';s.dispatchEvent(new Event('change',{bubbles:true}));
              });
              const ahmed="Je m’appelle Ahmed. J’aime les chiens mais je n’aime pas les poissons.";
              await page.evaluate(v=>{document.querySelector('#writeAnswer').value=v;},ahmed);
              await page.evaluate(()=>document.querySelector('#checkWrite').click());
              const feedback=await page.locator('#writeFeedback').textContent();
              if(!feedback.includes('Ready'))throw new Error('Independent-writing check did not pass: '+feedback);

              const checks=await page.locator('#writeChecklist .grammarCard').count();
              if(checks!==4)throw new Error('Expected 4 writing checks, found '+checks);

              await page.waitForSelector('#frSpeak',{state:'attached'});
              const target=await page.locator('#pronunciationLab .apc-target-text').textContent().catch(()=>null);
              if(target && !target.includes('Ahmed') && !target.includes('Sophie') && !target.includes('Chantal'))throw new Error('Unexpected pronunciation target: '+target);

              console.log('PASS latest French opinions homework', {title,people,built,feedback,checks,target});
              await browser.close();
              return;
            }
            throw new Error('Latest deployed page did not expose the new opinions pack in time');
          })().catch(async err=>{console.error(err);if(browser)await browser.close().catch(()=>{});process.exit(1)});
          NODE
