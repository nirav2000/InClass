name: Build and validate InClass PWA artwork
on:
  push:
    branches: [main]
    paths:
      - pwa.config.json
      - index.html
      - icon.svg
      - icons/**
      - sw.js
      - manifest.webmanifest
      - .github/workflows/pwa-assets.yml
      - tests/pwa-assets.test.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inclass-pwa-assets
  cancel-in-progress: false

jobs:
  build-assets:
    uses: nirav2000/Apps/.github/workflows/reusable-pwa-assets.yml@main
    with:
      app-config: pwa.config.json
      verification: |
        node tests/pwa-assets.test.mjs
        node tests/avoir-concepts.test.cjs
        node --test tests/session-recorder.test.mjs
