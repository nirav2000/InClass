# retry after event-binding fix
name: Verify French grammar and pronunciation teaching

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-french-grammar-teaching.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install chromium
      - name: Exercise deployed French lesson
        run: |
          timeout 120s node <<'NODE'
          const { chromium } = require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let attempt=1;attempt<=10;attempt++){
              const browser=await chromium.launch({headless:true});
              const page=await browser.newPage({serviceWorkers:'block',viewport:{width:1280,height:1000}});
              page.setDefaultTimeout(12000);
              try{
                await page.goto('https://nirav2000.github.io/InClass/?grammar_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:25000});
                const version=await page.locator('footer .version').textContent().catch(()=> '');
                if(!version.includes('2026.10.05.4')){await browser.close();await sleep(5000);continue;}
                await page.evaluate(()=>document.querySelector('#appShell').classList.remove('hidden'));
                await page.evaluate(()=>{const s=document.querySelector('#subjectSelect');s.value='French';s.dispatchEvent(new Event('change',{bubbles:true}));});
                const ready=await page.waitForFunction(()=>Array.from(document.querySelector('#weekSelect').options).some(o=>o.value==='2026-10-05-french-opinions'),null,{timeout:10000}).then(()=>true).catch(()=>false);
                if(!ready){await browser.close();await sleep(5000);continue;}
                await page.evaluate(()=>{const w=document.querySelector('#weekSelect');w.value='2026-10-05-french-opinions';w.dispatchEvent(new Event('change',{bubbles:true}));});
                await page.waitForSelector('#frBridge',{state:'attached'});

                const bridge=await page.locator('#frBridge').textContent();
                for(const term of ['les means “the”','definite article','le','la','l’','masculine singular','feminine singular','all plurals']){
                  if(!bridge.includes(term))throw new Error('Missing article teaching: '+term);
                }
                if(await page.locator('#frBridge .inlineSpeak').count()<4)throw new Error('Pronunciation controls missing beside bridge examples');

                const neg=await page.locator('#frNegation').textContent();
                if(!neg.includes('ne … pas')||!neg.includes('n’aime')||!neg.includes('I don’t like'))throw new Error('Negation explanation incomplete');
                await page.selectOption('#negationAnimal','chats');
                await page.click('#checkNegation');
                const negAnswer=await page.locator('#negationAnswer').textContent();
                if(!negAnswer.includes('Je n’aime pas les chats.'))throw new Error('Negation practice wrong: '+negAnswer);

                const opinions=await page.locator('#frOpinions').textContent();
                if(!opinions.includes('beaucoup means “a lot”')||!opinions.includes('optional'))throw new Error('Beaucoup provenance/explanation missing');
                if(opinions.includes('J’aime (beaucoup)')||opinions.includes('Je n’aime pas (beaucoup)'))throw new Error('Optional beaucoup still presented as core opinion label');

                const animal=page.locator('.revealWord').first();
                const before=await animal.locator('.revealMeaning').textContent();
                if(!before.includes('Tap to reveal English'))throw new Error('Old vocabulary is not hidden by default');
                await animal.click();
                const after=await animal.locator('.revealMeaning').textContent();
                if(after.includes('Tap to reveal'))throw new Error('English reveal did not work');

                const personal=await page.locator('.personalInterestCard').count();
                if(personal<5)throw new Error('Personal interest extensions missing');
                const extend=await page.locator('#frExplore').textContent();
                for(const term of ['faire de la voile','jouer au hockey','jouer au netball','jouer dans un orchestre','nager']){
                  if(!extend.includes(term))throw new Error('Missing personal French: '+term);
                }
                if(await page.locator('#frExplore .inlineSpeak').count()<3)throw new Error('Extension pronunciation buttons missing');

                console.log('PASS',{version,negAnswer,before,after,personal});
                await browser.close();
                return;
              }catch(err){
                console.error('attempt',attempt,err.message);
                await browser.close();
                if(attempt===10)throw err;
                await sleep(5000);
              }
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
