name: Rebuild curated Version Lab history

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/version-lab-curated-rebuild.yml"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out consuming app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out shared Apps Version Lab
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: main
          path: .shared-apps-platform
      - name: Rebuild from reviewed historical plan
        env:
          VERSION_LAB_BACKFILL_PLAN: version-lab-backfill-plan.json
        run: |
          rm -rf version-lab-data
          node .shared-apps-platform/version-lab/tooling/backfill-history.mjs
      - name: Validate Version Lab history
        run: node .shared-apps-platform/version-lab/tooling/validate-release.mjs
      - name: Remove shared tooling checkout
        run: rm -rf .shared-apps-platform
      - name: Commit reviewed history
        run: |
          git config user.name "Apps Version Lab"
          git config user.email "version-lab@users.noreply.github.com"
          git add version-lab-data version-lab-backfill-plan.json
          if git diff --cached --quiet; then
            echo "No Version Lab history changes"
            exit 0
          fi
          git commit -m "Rebuild Version Lab from reviewed history"
          git push
