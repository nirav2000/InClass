name: Verify French vocabulary audio fix v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-french-audio-fix-v3.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install chromium
      - name: Exercise deployed French word click
        run: |
          timeout 60s node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({serviceWorkers:'block'});
            page.setDefaultTimeout(10000);
            await page.addInitScript(()=>{
              window.__spoken=[];
              Object.defineProperty(window,'speechSynthesis',{configurable:true,value:{
                getVoices:()=>[{lang:'fr-FR',name:'Test French'},{lang:'en-GB',name:'Test English'}],
                cancel:()=>{},
                speak:u=>window.__spoken.push({text:u.text,lang:u.lang}),
                onvoiceschanged:null
              }});
            });
            console.log('opening');
            await page.goto('https://nirav2000.github.io/InClass/?vl_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
            console.log('loaded');
            await page.waitForSelector('#subjectSelect',{state:'attached'});
            const options=await page.locator('#subjectSelect option').allTextContents();
            console.log('subjects',options);
            await page.evaluate(()=>{
              const s=document.querySelector('#subjectSelect');
              const opt=Array.from(s.options).find(o=>o.textContent==='French');
              if(!opt)throw new Error('French subject option missing');
              s.value=opt.value;
              s.dispatchEvent(new Event('change',{bubbles:true}));
            });
            console.log('selected French');
            await page.waitForSelector('.wordButton',{state:'attached'});
            const count=await page.locator('.wordButton').count();
            console.log('buttons',count);
            if(count<2)throw new Error('Expected multiple French vocabulary buttons, found '+count);
            const wired=await page.evaluate(()=>Array.from(document.querySelectorAll('.wordButton')).every(b=>typeof b.onclick==='function'));
            if(!wired)throw new Error('One or more French vocabulary buttons have no click handler');
            await page.evaluate(()=>{
              window.__spoken=[];
              window.speak=(text,lang)=>window.__spoken.push({text,lang});
              document.querySelector('.wordButton').click();
            });
            console.log('clicked');
            const spoken=await page.evaluate(()=>window.__spoken.slice());
            const last=spoken.at(-1);
            console.log('spoken',last);
            if(!last)throw new Error('French vocabulary click handler did not call speak()');
            if(!String(last.lang||'').toLowerCase().startsWith('fr'))throw new Error('Wrong speech language: '+JSON.stringify(last));
            await browser.close();
            console.log('PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
