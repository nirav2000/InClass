name: Capture French verb explorer checkpoint

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/version-lab-french-verb-explorer-checkpoint.yml"

jobs:
  checkpoint:
    uses: nirav2000/Apps/.github/workflows/version-lab-release.yml@main
    with:
      title: "French interactive verb explorer"
      summary: "Made verbs in Sai-specific French extension sentences interactive so a learner can tap a conjugated verb or infinitive to see its English meaning, dictionary infinitive, present-tense forms, usage note and hear each form."
      areas: "Verb understanding::learning::Tap verbs in personal extension sentences to inspect meaning and infinitive|Conjugation::learning::Show all six present-tense subject forms for aimer adorer faire jouer and nager|Pronunciation::learning::Add audio controls for each conjugated verb form|Personal French::extension::Connect grammar exploration directly to sailing hockey netball orchestra and swimming examples"
      product_version: "2026.10.05.5"
    permissions:
      contents: write
