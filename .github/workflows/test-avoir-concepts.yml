name: Verify French avoir conceptual teaching

on:
  push:
    branches: [main]
    paths:
      - "french-avoir.js"
      - "french-avoir.css"
      - "data/2026-11-02-french-avoir.js"
      - "services/data-service.js"
      - "index.html"
      - "tests/avoir-concepts.test.cjs"
      - ".github/workflows/test-avoir-concepts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-avoir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test concepts and unchanged school spelling assessment
        run: node tests/avoir-concepts.test.cjs
